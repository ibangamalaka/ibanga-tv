<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBANGA TV | Live Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff0000;
            --surface: #121212;
            --bg: #080808;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header Fixe */
        header {
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .logo { font-size: 22px; font-weight: 900; color: var(--primary); text-transform: uppercase; }

        .search-bar {
            background: #222;
            padding: 5px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            width: 250px;
        }

        .search-bar input {
            background: transparent; border: none; color: white; padding-left: 8px; width: 100%; outline: none;
        }

        /* Zone Vidéo - Reste visible en haut */
        #player-section {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            max-height: 50vh; /* Limite la taille pour laisser voir la liste */
        }

        /* Zone de Défilement (Liste des chaînes) */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px 5%;
        }

        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--surface);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .card:hover {
            background: #1e1e1e;
            border-color: var(--primary);
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 60px;
            object-fit: contain;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .card span {
            font-size: 12px;
            font-weight: 500;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Scrollbar Look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo">IBANGA TV</div>
    <div class="search-bar">
        <i class="fa fa-search"></i>
        <input type="text" id="findInput" placeholder="Chercher une chaîne...">
    </div>
</header>

<div id="player-section">
    <video id="hlsPlayer" controls autoplay muted></video>
</div>

<main>
    <div class="grid-header">
        <h2 style="font-size: 18px;">En direct en ce moment</h2>
    </div>
    <div class="channel-grid" id="grid">
        </div>
</main>

<script>
    const player = document.getElementById('hlsPlayer');
    const grid = document.getElementById('grid');
    const search = document.getElementById('findInput');
    let db = [];

    // Fonction de lecture avec AUTOPLAY
    function play(url) {
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(player);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                player.muted = false; // On essaie d'activer le son au clic
                player.play();
            });
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            player.play();
        }
        // Remonte légèrement pour bien voir le player si on est sur mobile
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render(data) {
        grid.innerHTML = data.map(ch => `
            <div class="card" onclick="play('${ch.url}')">
                <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/150x80?text=TV'">
                <span>${ch.name}</span>
            </div>
        `).join('');
    }

    fetch('channels.json')
        .then(r => r.json())
        .then(d => {
            db = d;
            render(d);
            // Lancer la première chaîne automatiquement au chargement ?
            if(d.length > 0) play(d[0].url);
        });

    search.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        render(db.filter(c => c.name.toLowerCase().includes(val)));
    });
</script>

</body>
</html>
